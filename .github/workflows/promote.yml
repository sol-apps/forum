name: Promote to sol-apps

# Fires the promoter the moment a change lands on main in the dev org. This is
# the ONLY link between "merged in sol-forge" and "live on <slug>.solhann.net";
# there is no schedule and no polling, so merge → live takes about as long as
# the deploy workflow itself.
#
# What this file must NOT become: the thing that does the promoting. It holds no
# checkout, runs no repo code, and touches nothing in sol-apps beyond starting a
# workflow. Every decision that matters — is the push a fast-forward, does the
# instance exist, which key deploys it — is made by the promoter, on its own
# runner, from prod-side state it re-reads on every run. Nothing here is trusted
# by anything there. The slug below is a hint the promoter revalidates, not an
# instruction it obeys.
#
# The mirror guard: this file is copied into sol-apps at promotion like every
# other file, so it will also run there. Under sol-apps it must do nothing —
# self-promotion would be a loop, and prod holds no dispatch token anyway. The
# owner check is what keeps the copy inert.
#
# WHY A SECRET CAN LIVE HERE AT ALL (invariant 3): PROMOTER_DISPATCH_TOKEN is a
# fine-grained PAT scoped to the promoter repo only, `actions: write` only. It
# cannot read prod code, cannot push, cannot reach any other repo. The worst a
# leak buys is starting the promoter — which then does exactly what it would
# have done on the next merge anyway. The containment is that the secret is
# referenced from a workflow file, and the agent's bot PAT has Contents + Pull
# requests but NOT Workflows: the agent cannot edit this file or add another one,
# so it can never route this secret into code it controls. That property is
# load-bearing. If the bot PAT ever gains Workflows, this secret has to leave the
# org and the dispatch has to move somewhere the agent cannot author.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing here uses GITHUB_TOKEN — the dispatch authenticates with the PAT below.
# Dropping it to nothing makes that explicit and unfalsifiable.
permissions: {}

jobs:
  promote:
    # TWO conditions, and the second one is not obvious.
    #
    # `github.event.created` is true when the push CREATED the ref. Generating a repo
    # from the template is exactly that: GitHub writes main in one push, which fires
    # this workflow before the agent has written a line and before any human has seen
    # anything. Left unguarded it promoted a bare scaffold to prod — created the repo,
    # provisioned a live instance, installed a deploy key — with the review gate never
    # involved. Observed, not theorised: sol-apps/coin-toss, 2026-08-21.
    #
    # Nothing is lost by skipping it. A repo whose main was just created has no app in
    # it yet; the promotion that matters is the one after a reviewed merge.
    # workflow_dispatch leaves `created` undefined, so the manual fallback still runs.
    if: github.repository_owner == 'sol-forge' && !github.event.created
    runs-on: ubuntu-latest
    steps:
      # No actions/checkout on purpose: this job never reads the repo it fires
      # for, so a hostile commit on main has nothing to reach here.
      - name: Dispatch the promoter
        env:
          # Secrets and repo-derived values go through env, never through direct
          # ${{ }} interpolation into the script body — interpolation splices
          # text into the shell before bash parses it.
          TOKEN: ${{ secrets.PROMOTER_DISPATCH_TOKEN }}
          SLUG: ${{ github.event.repository.name }}
          SHA: ${{ github.sha }}
          PROMOTER: sol-apps/promoter
          WORKFLOW: promote.yml
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::PROMOTER_DISPATCH_TOKEN is not set on the sol-forge org."
            echo "Without it a merge to main never reaches prod, silently. Set the"
            echo "org secret (fine-grained PAT, $PROMOTER only, actions: write)."
            exit 1
          fi

          # The promoter takes the slug as an input rather than deriving it, so
          # the same workflow serves the manual fallback (Run workflow in the UI).
          # It is revalidated there against the forge repo that actually exists.
          payload=$(jq -nc --arg slug "$SLUG" --arg sha "$SHA" \
            '{ref: "main", inputs: {slug: $slug, expect_sha: $sha}}')

          code=$(curl -sS -o response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "User-Agent: greenlight-promote" \
            "https://api.github.com/repos/$PROMOTER/actions/workflows/$WORKFLOW/dispatches" \
            -d "$payload")

          # 204 No Content is the ONLY success for workflow_dispatch. Anything
          # else must fail the run: a promotion that was never started needs to
          # look exactly as broken as a promotion that failed, otherwise a merged
          # PR sits un-deployed with a green tick next to it.
          if [ "$code" = "204" ]; then
            echo "✓ promoter dispatched for $SLUG @ ${SHA:0:7}"
            exit 0
          fi

          echo "::error::promoter dispatch failed — HTTP $code"
          cat response.txt
          case "$code" in
            401|403) echo "::error::token rejected: expired, revoked, or missing actions:write on $PROMOTER" ;;
            404)     echo "::error::$PROMOTER or .github/workflows/$WORKFLOW not found — note 404 is also what a token with no access to the repo returns" ;;
            422)     echo "::error::the promoter workflow rejected the inputs (slug/expect_sha) or has no workflow_dispatch trigger on main" ;;
          esac
          exit 1
